<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFG</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
<aside class="side">
  <a class="brand" href="#home"><img src="/assets/logo.svg" alt="" width="22" height="22"><span>LFG</span></a>
  <div class="pickers">
    <select id="repo" aria-label="Project"></select>
    <select id="branch" aria-label="Branch"></select>
  </div>
  <nav id="nav" aria-label="Main"></nav>
  <div class="side-foot">
    <span class="status" id="map-status" title="The code map LFG's agents read instead of whole files"></span>
    <div>LFG by Varun Singh · runs only on this computer</div>
  </div>
</aside>
<main id="view" class="view" tabindex="-1"><div class="loading">Loading…</div></main>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-panel">
    <div class="drawer-head"><div id="drawer-title"></div><button class="icon-btn" id="drawer-close" aria-label="Close">&times;</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
